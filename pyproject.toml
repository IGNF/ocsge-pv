[project]

name = "ocsge-pv"
version = "0.0.0"

description = "Python tools for generation of the photovoltaic data used in OCSGE from IGN France"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICEN[CS]E.*"]

keywords = ["aggregation", "OCSGE", "photovoltaic"]

authors = [
  {name = "Géoplateforme IGN developers", email = "tout_rde@ign.fr" }
]

classifiers = [

  "Development Status :: 3 - Alpha",

  "Topic :: Software Development",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  # "GDAL == $(gdal-config --version)", # Must be the same exact version as the system's gdal libraries (libgdal).
  "gql[aiohttp]",
  "psycopg",
  "jsonschema >= 4.23.0"
]

[project.optional-dependencies]
doc = [
  "mkdocs >= 1.6, < 2",
  "mkdocstrings[python] >= 1.0",
  "mkdocs-extrafiles >= 1.0",
  "mkdocs-material >= 9.7"
]

dev = [
  "black",
  "isort >= 5.12.0",
  "pre-commit >3,<4",
  "ruff >= 0.0.281"
]

test = [
  "pytest >= 7.1.2",
  "coverage >= 7.0.5"
]

[project.urls]
"Homepage" = "https://github.com/IGNF/ocsge-pv"
"Bug Reports" = "https://github.com/IGNF/ocsge-pv/issues"
"Changelog" = "https://github.com/IGNF/ocsge-pv/releases"
"Source" = "https://github.com/IGNF/ocsge-pv"

[project.scripts]
# Concatenation of alls commands CLI help outputs
ocsge-pv-help = "ocsge_pv.ocsge_pv_help:main"
ocsge-pv = "ocsge_pv.ocsge_pv_help:main"
ocsge_pv_help = "ocsge_pv.ocsge_pv_help:main"
ocsge_pv = "ocsge_pv.ocsge_pv_help:main"
# Declarative data import
import_declarations = "ocsge_pv.import_declarations:main"
# Declarative data X observation data pairing
pair_from_sources = "ocsge_pv.pair_from_sources:main"
# Objects deletion from data
delete_data = "ocsge_pv.delete_data:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []

[tool.setuptools.packages.find]
where = ["src"]
