name: Test, build and publish artefacts and documentation

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+b[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  pages: write
  pull-requests: read

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      job_status: ${{ job.status }}
    steps:
      - name: Checkout project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ contains(github.ref_name ,'b') }}


  build_and_test:
    name: Test and build artefacts
    needs: create_release
    outputs:
      job_status: ${{ job.status }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-22.04
            python-version: "3.10"
          - os: ubuntu-22.04
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/pyproject.toml'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install python3-gdal libgdal-dev

      - name: Install python dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade build bump2version "gdal==$(gdal-config --version)"
          bump2version --current-version 0.0.0 --new-version ${{ github.ref_name }} patch
          pip install -e .

      - name: Run unit tests
        run: |
          export OCSGE_PV_FIXTURE_DIR=$(realpath ./tests/fixtures)
          export OCSGE_PV_RESOURCE_DIR=$(realpath ./src/ocsge_pv/resources)
          source .venv/bin/activate
          pip install -e .[test]
          coverage run -m pytest
          coverage report -m

      - name: Build unit tests report
        if: "! contains(github.ref_name,'b') && matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'"
        run: |
          source .venv/bin/activate
          coverage html -d target/docs/tests/
          rm target/docs/tests/.gitignore

      - name: Build documentation
        if: "matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'"
        run: |
          source .venv/bin/activate
          pip install -e .[doc]
          mkdocs build

      - name: Upload static files as artifact
        if: "matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'"
        id: ghp_deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

      - name: Publish documentation
        if: "! matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'"
        run: |
          source .venv/bin/activate
          pip install .[doc] "mike >= 2.2"
          cd public/
          mike deploy --push --update-aliases --branch gh-pages -t "Version ${{ github.ref_name }}" ${{ github.ref_name }} latest
          mike set-default --push --branch gh-pages ${{ github.ref_name }}


  build_and_publish_docker:
    name: Build docker image and push it to github repository
    needs: build_and_test
    if: "always() && needs.create_release.outputs.job_status == 'success' && needs.build_and_test.outputs.job_status == 'success'"
    outputs:
      job_status: ${{ job.status }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Log in to GitHub Container Repository
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: docker_mtd
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels:
            org.opencontainers.image.vendor=IGN (Institut national de l’information géographique et forestière) (https://www.ign.fr)
            org.opencontainers.image.base.name=docker.io/library/ubuntu:24.04

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build and push Docker image
        id: docker_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: true
          tags: ${{ steps.docker_mtd.outputs.tags }}
          labels: ${{ steps.docker_mtd.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.docker_push.outputs.digest }}
          push-to-registry: true


  delete_version:
    name: Remove release and tag if error occured
    needs: build_and_publish_docker
    if: "always() && needs.create_release.outputs.job_status == 'success' && (needs.build_and_test.outputs.job_status != 'success' || needs.build_and_publish_docker.job_status != 'success')"
    runs-on: ubuntu-latest

    steps:
      - name: Remove release and tag
        uses: dev-drprasad/delete-tag-and-release@v82600feb9527126eca69833f07bafe53279bd9b4
        with:
          tag_name: ${{ github.ref_name }}
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
